<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0FA"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </radialGradient>
    <radialGradient id="blob" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFC2E4"/>
      <stop offset="55%" stop-color="#FF9DD2"/>
      <stop offset="100%" stop-color="#E89BFF"/>
    </radialGradient>
  </defs>
  <!-- Hintergrund -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Blob-Körper -->
  <ellipse cx="256" cy="270" rx="140" ry="130" fill="url(#blob)" filter="drop-shadow(0 12px 24px rgba(255,133,200,.4))"/>
  <!-- Augen -->
  <ellipse cx="220" cy="248" rx="14" ry="18" fill="#4A2D48"/>
  <ellipse cx="292" cy="248" rx="14" ry="18" fill="#4A2D48"/>
  <!-- Glanz in Augen -->
  <ellipse cx="226" cy="242" rx="5" ry="6" fill="white" opacity="0.8"/>
  <ellipse cx="298" cy="242" rx="5" ry="6" fill="white" opacity="0.8"/>
  <!-- Wangen -->
  <ellipse cx="192" cy="278" rx="22" ry="14" fill="#FF85C8" opacity="0.55"/>
  <ellipse cx="320" cy="278" rx="22" ry="14" fill="#FF85C8" opacity="0.55"/>
  <!-- Mund -->
  <path d="M 228 290 Q 256 316 284 290" stroke="#4A2D48" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Glanz oben -->
  <ellipse cx="230" cy="195" rx="48" ry="28" fill="white" opacity="0.35" transform="rotate(-18 230 195)"/>
  <!-- Sterne -->
  <text x="130" y="160" font-size="48" fill="#FFD700" opacity="0.9">✨</text>
  <text x="330" y="150" font-size="36" fill="#FF85C8" opacity="0.85">💕</text>
  <text x="150" y="410" font-size="30" fill="#9B6DFF" opacity="0.7">⭐</text>
  <text x="320" y="420" font-size="32" fill="#FFB3D9" opacity="0.75">🌸</text>
</svg>
